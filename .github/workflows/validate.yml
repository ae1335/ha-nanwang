name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository
permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (pyflakes + verify_all)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies (incl. real homeassistant)
        run: pip install pyflakes pytest pycryptodome requests homeassistant

      - name: Run pyflakes
        run: python -m pyflakes custom_components/csg_power tests verify_all.py

      - name: Run unit tests (against the real homeassistant package)
        run: python -m pytest tests/ -v

      - name: Import integration with real homeassistant
        run: |
          python -c "from homeassistant.const import __version__; print('HA version:', __version__)"
          python -c "import custom_components.csg_power"
          python -c "import custom_components.csg_power.sensor"
          python -c "import custom_components.csg_power.config_flow"
          echo "REAL HA IMPORT OK"

      - name: Run verify_all.py
        run: python verify_all.py

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # The brands check fails until this integration is registered in the
    # home-assistant/brands repository (one-time PR). Keep the job visible
    # but non-blocking until then.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run HACS action
        uses: hacs/action@main
        with:
          category: integration
