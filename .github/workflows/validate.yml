name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: Static checks (pyflakes + verify_all)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pyflakes pytest pycryptodome requests

      - name: Run pyflakes
        run: python -m pyflakes custom_components/csg_power tests verify_all.py

      - name: Run verify_all.py
        run: python verify_all.py

      - name: Run unit tests
        run: python -m pytest tests/ -v

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # The brands check fails until this integration is registered in the
    # home-assistant/brands repository (one-time PR). Keep the job visible
    # but non-blocking until then.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run HACS action
        uses: hacs/action@main
        with:
          category: integration
